name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# El workflow solo lee el repositorio: nada de lo que corre necesita
# permisos de escritura sobre él.
permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest

    steps:
      # Fijada por SHA y no por tag: un tag puede moverse, un SHA no.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verificar sintaxis de scripts
        shell: pwsh
        run: |
          $errores = @()
          Get-ChildItem -File | Where-Object { $_.Extension -in ".ps1", ".psm1" } | ForEach-Object {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$null, [ref]$parseErrors
            )
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { $errores += "$($_.Extent.File): $_" } }
          }
          if ($errores.Count -gt 0) {
            $errores | ForEach-Object { Write-Error $_ }
            exit 1
          }
          Write-Host "Sintaxis OK en todos los scripts."

      - name: Verificar encoding UTF-8 BOM
        shell: pwsh
        run: |
          $bom = [byte[]]@(0xEF, 0xBB, 0xBF)
          $errores = @()
          Get-ChildItem -File | Where-Object { $_.Extension -in ".ps1", ".psm1" } | ForEach-Object {
            $bytes = [System.IO.File]::ReadAllBytes($_.FullName)
            $tieneBOM = $bytes.Length -ge 3 -and
                        $bytes[0] -eq $bom[0] -and
                        $bytes[1] -eq $bom[1] -and
                        $bytes[2] -eq $bom[2]
            if (-not $tieneBOM) { $errores += $_.Name }
          }
          if ($errores.Count -gt 0) {
            Write-Error "Sin BOM UTF-8: $($errores -join ', ')"
            exit 1
          }
          Write-Host "Encoding OK en todos los scripts."

      - name: Lint con PSScriptAnalyzer
        shell: pwsh
        run: |
          # Versión fija a propósito: se actualiza a mano, no "a lo que
          # PSGallery tenga publicado hoy".
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Force -Scope CurrentUser
          $excluir = @(
            'PSAvoidUsingPositionalParameters',
            'PSUseSingularNouns',
            'PSUseShouldProcessForStateChangingFunctions',
            # Write-Host es el output esperado en scripts interactivos de
            # instalación/desinstalación (no debug, no una librería).
            'PSAvoidUsingWriteHost'
          )
          $resultado = Get-ChildItem -File | Where-Object { $_.Extension -in ".ps1", ".psm1" } |
            ForEach-Object { Invoke-ScriptAnalyzer -Path $_.FullName -ExcludeRule $excluir } |
            Where-Object { $_.Severity -in @('Error', 'Warning') }
          if ($resultado) {
            $resultado | Format-Table RuleName, Severity, Line, Message -AutoSize
            exit 1
          }
          Write-Host "Lint OK."

      - name: Tests con Pester
        shell: pwsh
        run: |
          # Versión fija a propósito, igual que PSScriptAnalyzer.
          Install-Module Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 5.7.1
          $config = New-PesterConfiguration
          $config.Run.Path = "tests"
          $config.Run.Exit = $true
          $config.Output.Verbosity = "Detailed"
          Invoke-Pester -Configuration $config
